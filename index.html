<section class="entry" id="entry"><div class="identity"><h1>DIEGO M. ALCALÁ</h1><p class="tagline">Brand Worlds</p></div><nav aria-label="Main navigation"><button id="enter">Work ↗</button><button id="contactBtn">Contact ↗</button></nav></section>

<script>
// Add image paths to each images array. Files can be JPG, PNG or WebP.
const projects=[
{name:'LUDOVIC',description:'An intimate dinner concept translating the designer’s sensual aesthetic into a spatial experience through materiality, light and atmosphere.',discipline:'Dinner / 2026',images:['fotos/ludovic/01.jpeg','fotos/ludovic/03.jpeg','fotos/ludovic/02.jpeg','fotos/ludovic/04.jpeg']},
{name:'BORAS',description:'A temporary retail experience set within a woodworking workshop, exploring the dialogue between fashion, craftsmanship and raw materials.',discipline:'Pop-up / 2026',images:['fotos/boras/01.jpeg','fotos/boras/04.jpeg','fotos/boras/02.jpeg','fotos/boras/03.jpeg']},
{name:'MIDNIGHT COSMETICS',description:'A spatial intervention exploring the relationship between object, material and display through a sculptural stainless steel installation.',discipline:'Pop-up / 2026',images:['fotos/midnight/01.jpeg','fotos/midnight/03.jpeg','fotos/midnight/02.jpeg','fotos/midnight/04.jpeg']},
{name:'LOEWE',description:'A conceptual dinner experience exploring craftsmanship, sculptural forms and the ritual of gathering around a table.',discipline:'Dinner / Concept proposal / 2026',images:['fotos/loewe/02.jpg','fotos/loewe/03.jpg','fotos/loewe/04.jpeg','fotos/loewe/01.jpg']}
];
const $=id=>document.getElementById(id);let p=0,i=0,returnFocus=null,initialIndex=false;const total=()=>Math.max(1,projects[p].images.length);const pad=n=>String(n).padStart(2,'0');
function render(){const project=projects[p];$('title').textContent=project.name;$('descriptionBox').hidden=!project.description;$('descriptionBox').open=false;$('description').textContent=project.description||'';$('discipline').textContent=project.discipline;$('count').textContent=project.images.length?`${pad(i+1)} / ${pad(total())}`:'Images pending';const frame=$('frame');frame.replaceChildren();function placeholder(){const box=document.createElement('div');box.className='placeholder';const name=document.createElement('span');name.textContent=project.name;const note=document.createElement('small');note.textContent='Image pending';box.append(name,note);frame.replaceChildren(box)}if(project.images[i]){const img=new Image();img.alt=`${project.name} — ${i+1}`;img.decoding="async";img.className='fade'+(project.name==='LOEWE'?'':' editorial');img.onerror=()=>{if(frame.contains(img))placeholder()};frame.append(img);img.src=project.images[i]}else placeholder();$('prev').disabled=$('next').disabled=total()<2;$('prev').style.opacity=$('next').style.opacity=total()<2?'.25':'';}
function move(d){i=(i+d+total())%total();render()}function choose(n){p=n;i=0;initialIndex=false;$('entry').hidden=true;$('gallery').hidden=false;render();closePanel();$('indexBtn').focus()}
$('enter').onclick=()=>{initialIndex=true;openPanel('index');$('entry').hidden=true};$('contactBtn').onclick=()=>{initialIndex=true;openPanel('info');$('entry').hidden=true};$('home').onclick=()=>{$('gallery').hidden=true;$('entry').hidden=false;$('enter').focus()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('nextProject').onclick=()=>choose((p+1)%projects.length);
function openPanel(type){returnFocus=document.activeElement;const content=$('panelContent');content.replaceChildren();if(type==='index'){const list=document.createElement('div');list.className='project-list index-layout';const preview=new Image();preview.className='index-preview fade';preview.alt='';preview.hidden=true;projects.forEach((project,n)=>{const b=document.createElement('button');const s=document.createElement('span');s.textContent=pad(n+1);b.append(s,document.createTextNode(project.name));b.onclick=()=>choose(n);const show=()=>{preview.classList.toggle('editorial',project.name!=='LOEWE');preview.src=project.images[0];preview.hidden=false};const hide=()=>{preview.hidden=true};b.addEventListener('mouseenter',show);b.addEventListener('mouseleave',hide);b.addEventListener('focus',show);b.addEventListener('blur',hide);list.append(b)});list.append(preview);content.append(list)}else{const heading=document.createElement('h2');heading.textContent='Diego M. Alcalá';const bio=document.createElement('p');bio.textContent='Independent creative practice exploring the relationship between space, image and experience.';const contact=document.createElement('p');contact.className='muted';contact.textContent='Based in Madrid, available worldwide.';const disciplines=document.createElement('p');disciplines.className='muted';disciplines.textContent='Design & Production Services';const links=document.createElement('div');links.className='contact-links';[['malcaladiego@gmail.com ↗','mailto:malcaladiego@gmail.com'],['@diegomalcala ↗','https://www.instagram.com/diegomalcala/']].forEach(([label,url])=>{const item=document.createElement('a');item.textContent=label;item.href=url;if(url.startsWith('https:')){item.target='_blank';item.rel='noopener noreferrer'}links.append(item)});const invitation=document.createElement('p');invitation.textContent="Let's create something together.";const tagline=document.createElement('p');tagline.className='muted';tagline.textContent='Brand Worlds';content.append(heading,tagline,bio,disciplines,contact,invitation,links)}$('panel').hidden=false;$('gallery').inert=true;$('close').focus()}
function closePanel(){if($('panel').hidden)return;$('panel').hidden=true;$('gallery').inert=false;if(initialIndex){initialIndex=false;$('entry').hidden=false;$('gallery').hidden=true;(returnFocus||$('enter')).focus()}else{returnFocus?.focus()}}
$('indexBtn').onclick=()=>openPanel('index');$('infoBtn').onclick=()=>openPanel('info');$('close').onclick=closePanel;
document.addEventListener('keydown',e=>{if(!$('panel').hidden){if(e.key==='Escape')closePanel();if(e.key==='Tab'){const items=[...$('panel').querySelectorAll('button,a')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}return}if($('gallery').hidden)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});let start=null;$('frame').addEventListener('touchstart',e=>{start=e.touches.length===1?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}:null},{passive:true});$('frame').addEventListener('touchend',e=>{if(start===null)return;const delta=e.changedTouches[0].clientX-start.x;const dy=e.changedTouches[0].clientY-start.y;if(Math.abs(delta)>45&&Math.abs(delta)>Math.abs(dy)*1.3)move(delta<0?1:-1);start=null},{passive:true});
</script></body></html>
