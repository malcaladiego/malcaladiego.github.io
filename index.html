<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F0EDE7">
<meta name="description" content="Diego M. Alcalá — Spatial Design / Brand Worlds. An exploration of space, identity and experiences. Full website coming soon.">
<title>Diego M. Alcalá — Spatial Design / Creative Direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#F0EDE7}
.diego-landing,.diego-landing *{box-sizing:border-box}
.diego-landing{--bone:#F0EDE7;--ink:#161414;--wine:#3B1523;position:relative;width:100%;min-height:100vh;min-height:100svh;padding:clamp(24px,4vw,70px);display:flex;flex-direction:column;background:var(--bone);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
.diego-header{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;flex-shrink:0;animation:diegoFade 1.2s ease both}
.diego-identity{display:flex;flex-direction:column;align-items:flex-start}
.diego-name{font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(25px,2.3vw,38px);font-weight:400;letter-spacing:-.045em;line-height:1.15}
.diego-specialty{margin-top:10px;font-size:11px;letter-spacing:.035em;opacity:.65}
.diego-practice{font-size:10px;letter-spacing:.14em;opacity:.55}
.diego-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,5vh,65px) 0}
.diego-content{animation:diegoReveal 1.8s cubic-bezier(.19,1,.22,1) both;animation-delay:.2s}
.diego-status{display:flex;align-items:center;gap:13px;margin-bottom:clamp(14px,2vh,28px);font-size:10px;letter-spacing:.2em}
.diego-dot{display:inline-block;width:6px;height:6px;flex-shrink:0;background:var(--wine);border-radius:50%;animation:diegoPulse 2.8s ease-in-out infinite}
.diego-landing .diego-title{margin:0;padding:0;font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(68px,10.5vw,185px);font-weight:400;line-height:.91;letter-spacing:-.075em;text-align:left;color:var(--ink)}
.diego-title span{display:block}
.diego-title span:last-child{font-style:italic;font-size:1.08em;letter-spacing:-.085em;color:var(--wine);transform-origin:left center;transition:color .8s cubic-bezier(.19,1,.22,1),transform .8s cubic-bezier(.19,1,.22,1)}
@media(hover:hover){.diego-title:hover span:last-child{color:#240C16;transform:translateX(8px)}}
.diego-description{margin-top:clamp(20px,3vh,34px);margin-left:4px;max-width:480px;font-size:clamp(12px,1vw,15px);line-height:1.65;opacity:.7}
.diego-description p{margin:0 0 4px}
.diego-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-shrink:0;padding-top:12px;font-size:10px;letter-spacing:.12em;animation:diegoFade 1.2s ease both;animation-delay:.8s}
.diego-contact{display:inline-block;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:5px;transition:color .3s ease,border-color .3s ease}
.diego-contact:hover{color:var(--wine);border-color:var(--wine)}
.diego-landing::after{content:"EST. MMXXVI — MADRID";position:absolute;right:22px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%);font-size:9px;letter-spacing:.22em;color:var(--wine);opacity:.45;pointer-events:none}
@keyframes diegoFade{from{opacity:0}to{opacity:1}}
@keyframes diegoReveal{from{opacity:0;transform:translateY(35px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes diegoPulse{0%,100%{opacity:1}50%{opacity:.2}}
@media(max-height:650px) and (min-width:769px){.diego-landing .diego-title{font-size:clamp(65px,9vw,140px)}.diego-main{padding:20px 0}}
@media(max-width:768px){
.diego-landing{padding:32px 22px 24px;min-height:100svh;overflow:visible}
.diego-practice,.diego-landing::after{display:none}
.diego-header,.diego-main,.diego-content,.diego-footer{width:100%}
.diego-name{font-size:clamp(23px,6.5vw,29px);line-height:1.2;letter-spacing:-.045em}
.diego-specialty{margin-top:8px;font-size:10px;letter-spacing:.01em;line-height:1.5}
.diego-main{min-width:0;padding:35px 0}
.diego-content{min-width:0}
.diego-status{margin-bottom:22px;font-size:9px}
.diego-landing .diego-title{font-size:clamp(42px,10.5vw,76px);line-height:.98;letter-spacing:-.075em;max-width:100%}
.diego-title span{white-space:nowrap}
.diego-title span:last-child{font-size:1.04em;letter-spacing:-.085em}
.diego-description{margin:30px 0 0;padding:0;max-width:100%;font-size:12px;line-height:1.6;text-align:left}
.diego-description p{margin:0 0 6px;text-align:left}
.diego-footer{font-size:9px;padding-top:15px;letter-spacing:.04em;gap:12px}
.diego-location,.diego-contact{white-space:nowrap}
}
@media(prefers-reduced-motion:reduce){.diego-header,.diego-content,.diego-footer,.diego-dot{animation:none}.diego-title span:last-child{transition:none}}
</style>
</head>
<body>
<div class="diego-landing">
<header class="diego-header">
<div class="diego-identity"><div class="diego-name">DIEGO M. ALCALÁ</div><div class="diego-specialty">Spatial Design / Creative Direction</div></div>
<div class="diego-practice">INDEPENDENT CREATIVE PRACTICE</div>
</header>
<main class="diego-main"><div class="diego-content">
<div class="diego-status"><span class="diego-dot"></span><span>CURRENTLY BUILDING</span></div>
<h1 class="diego-title"><span>WORK IN</span><span>PROGRESS.</span></h1>
<div class="diego-description"><p>An exploration of space, identity and experiences.</p><p>Full website coming soon.</p></div>
</div></main>
<footer class="diego-footer"><div class="diego-location">MADRID, ES — 2026</div><a class="diego-contact" href="mailto:malcaladiego@gmail.com">CONTACT ↗</a></footer>
</div>
</body>
</html>
